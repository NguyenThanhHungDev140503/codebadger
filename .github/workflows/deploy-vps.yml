name: Build and deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

# A new release supersedes any queued release, but never interrupt a deployment
# that is already changing the VPS stack.
concurrency:
  group: codebadger-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/nguyenthanhhungdev140503
  VPS_APP_DIR: /opt/codebadger

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.image.outputs.tag }}

    steps:
      - name: Check out the release commit
        uses: actions/checkout@v6

      - name: Set image tag
        id: image
        run: echo "tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and publish MCP image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.mcp
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/codebadger-mcp:${{ steps.image.outputs.tag }}
            ${{ env.IMAGE_PREFIX }}/codebadger-mcp:latest

      - name: Build and publish Joern image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/codebadger-joern-server:${{ steps.image.outputs.tag }}
            ${{ env.IMAGE_PREFIX }}/codebadger-joern-server:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read

    steps:
      - name: Check out deployment files
        uses: actions/checkout@v6

      - name: Configure SSH
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Sync Compose and deployment scripts
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes "$VPS_HOST" \
            'install -d -m 0755 /opt/codebadger/{scripts,playground,pgdata,logs}'
          rsync -az --info=progress2 \
            --exclude='.env' --exclude='playground/' --exclude='pgdata/' --exclude='logs/' \
            -e 'ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes' \
            docker-compose.yml .env.defaults scripts \
            "$VPS_HOST:$VPS_APP_DIR/"

      - name: Pull and deploy the immutable image tag
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes "$VPS_HOST" \
            "IMAGE_TAG='$IMAGE_TAG' IMAGE_PREFIX='$IMAGE_PREFIX' bash -s" <<'REMOTE'
          set -euo pipefail
          cd /opt/codebadger

          # `.env` is host-owned. Create only the non-secret baseline on the
          # first deployment; subsequent deploys change image coordinates only.
          if [[ ! -f .env ]]; then
            cat > .env <<'ENV'
          PLAYGROUND_HOST_PATH=/opt/codebadger/playground
          POSTGRES_DATA_PATH=/opt/codebadger/pgdata
          DOCKER_HOST=unix:///var/run/docker.sock
          DOCKER_SOCK=/var/run/docker.sock
          MCP_PUBLISH_HOST=127.0.0.1
          ENV
            chmod 600 .env
          fi

          current_tag="$(sed -n 's/^IMAGE_TAG=//p' .env | tail -1)"
          if [[ -n "$current_tag" ]]; then
            printf '%s\n' "$current_tag" > .last-deploy
          fi
          sed -i '/^IMAGE_REGISTRY=/d; /^IMAGE_TAG=/d' .env
          printf 'IMAGE_REGISTRY=%s/\nIMAGE_TAG=%s\n' "$IMAGE_PREFIX" "$IMAGE_TAG" >> .env

          docker compose config --quiet
          docker compose pull
          docker compose up -d --no-build

          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4242/health | grep -q '"status"'; then
              break
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:4242/health
          bash scripts/smoke-test.sh
          REMOTE
